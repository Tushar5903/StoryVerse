#############################################
# SAFE TEMPLATE - placeholders only, safe to commit.
# Copy to application.properties (gitignored) and fill in real values,
# or export the variables below in your environment.
# The real application.properties is gitignored - never commit secrets.
#############################################

spring.config.import=optional:file:.env[.properties]

#############################################
# Application
#############################################

spring.application.name=StoryVerse
server.port=${SERVER_PORT:8082}

#############################################
# Active Profile
#############################################

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Hibernate / JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ===============================
# Spring Data Web (pagination)
# ===============================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

#############################################
# Cache (Caffeine, in-memory - single instance)
#############################################
spring.cache.cache-names=bookCatalog,authors,authorBooks,publicProfiles,dashboard
spring.cache.caffeine.spec=${CACHE_SPEC:maximumSize=1000,expireAfterWrite=60s}

#############################################
# Connection Pool (HikariCP)
#############################################
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

#############################################
# Flyway
#############################################

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

#############################################
# Mail
#############################################

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#############################################
# JWT
#############################################

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-minutes=${JWT_ACCESS_MINUTES:30}
app.security.jwt.refresh-days=${REFRESH_TOKEN_DAYS:2}
app.security.otp.ttl-seconds=${OTP_TTL_SECONDS:300}

# Swagger/OpenAPI is a dev aid only - OFF by default so a prod deploy can't
# accidentally expose the full API surface (admin endpoints included).
# Set SWAGGER_ENABLED=true for local development.
app.security.swagger-enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

#############################################
# Rate Limiting (auth/OTP endpoints only)
#############################################

app.security.rate-limit.send-otp-per-15m=${RATE_LIMIT_SEND_OTP:3}
app.security.rate-limit.verify-otp-per-15m=${RATE_LIMIT_VERIFY_OTP:5}
app.security.rate-limit.login-per-15m=${RATE_LIMIT_LOGIN:10}
app.security.rate-limit.login-account-per-15m=${RATE_LIMIT_LOGIN_ACCOUNT:10}
app.security.rate-limit.forgot-per-hour=${RATE_LIMIT_FORGOT:3}
app.security.rate-limit.refresh-per-15m=${RATE_LIMIT_REFRESH:30}

# Comma-separated IPs of trusted reverse proxies that overwrite X-Forwarded-For.
# Rate limiting only honors the header from these addresses; empty = never trust it.
app.security.trusted-proxies=${TRUSTED_PROXIES:}

#############################################
# CORS
#############################################

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

#############################################
# Application
#############################################

app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}
app.mail.from=${MAIL_FROM:no-reply@storyverse.local}

#############################################
# Cloudinary
#############################################

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

#############################################
# File Upload
#############################################

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#############################################
# Logging
#############################################

logging.level.com.storyreview=${APP_LOG_LEVEL:INFO}

#############################################
# Actuator
#############################################

management.endpoints.web.exposure.include=health,info,metrics
management.health.mail.enabled=false

#############################################
# PRODUCTION JVM / tuning notes (see deploy/nginx.conf + deploy/mysql.cnf)
#############################################
# Start the jar with a tuned heap (the app is a small CRUD service - G1 with a
# modest heap beats the default): e.g.
#   java -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -jar storyverse.jar
# Do NOT raise the heap without also raising DB_POOL_MAX/mysql buffer pool.
# Slow queries: set SHOW_SQL=true temporarily, or add
#   -Dlogging.level.org.hibernate.SQL=DEBUG
# Monitoring: GET /actuator/metrics, /actuator/health are already exposed; wire
# them into your uptime monitor.
