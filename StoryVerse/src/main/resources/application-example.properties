#############################################
# SAFE TEMPLATE - placeholders only, safe to commit.
# Copy to application.properties (gitignored) and fill in real values,
# or export the variables below in your environment.
# The real application.properties is gitignored - never commit secrets.
#############################################

spring.config.import=optional:file:.env[.properties]

#############################################
# Application
#############################################

spring.application.name=StoryVerse
server.port=${SERVER_PORT:8082}

#############################################
# Active Profile
#############################################

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Hibernate / JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

#############################################
# Connection Pool (HikariCP)
#############################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

#############################################
# Flyway
#############################################

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

#############################################
# Mail
#############################################

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#############################################
# JWT
#############################################

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-minutes=${JWT_ACCESS_MINUTES:30}
app.security.otp.ttl-seconds=${OTP_TTL_SECONDS:300}

#############################################
# Rate Limiting (auth/OTP endpoints only)
#############################################

app.security.rate-limit.send-otp-per-15m=${RATE_LIMIT_SEND_OTP:3}
app.security.rate-limit.verify-otp-per-15m=${RATE_LIMIT_VERIFY_OTP:5}
app.security.rate-limit.login-per-15m=${RATE_LIMIT_LOGIN:10}
app.security.rate-limit.forgot-per-hour=${RATE_LIMIT_FORGOT:3}
app.security.rate-limit.refresh-per-15m=${RATE_LIMIT_REFRESH:30}

#############################################
# CORS
#############################################

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

#############################################
# Application
#############################################

app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}
app.mail.from=${MAIL_FROM:no-reply@storyverse.local}

#############################################
# Cloudinary
#############################################

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

#############################################
# File Upload
#############################################

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#############################################
# Logging
#############################################

logging.level.com.storyreview=${APP_LOG_LEVEL:INFO}

#############################################
# Actuator
#############################################

management.endpoints.web.exposure.include=health,info,metrics
management.health.mail.enabled=false
