# StoryVerse - reference nginx config (single instance behind nginx).
# Copy to /etc/nginx/sites-available/storyverse and adjust the domain/TLS paths.
# App serves on 127.0.0.1:8082; the React build (FRONTEND/dist) is served statically.

# Rate limit for the public API (esp. the DB-heavy FULLTEXT search on /api/books?q=).
# 30 req/s per client IP with a 60-request burst; 429 beyond that.
limit_req_zone $binary_remote_addr zone=storyverse_api:10m rate=30r/s;

# --- Logging ---
# The default 'combined' format logs full URIs including query strings, so the
# password-reset link's ?token= would be written to disk in the access log. $uri
# drops the query string - keep it that way (tokens also stay out of browser
# history is not possible, but logs are the attacker-visible surface).
log_format storyverse '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name storyverse.example.com;

    access_log /var/log/nginx/access.log storyverse;

    # Redirect everything to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name storyverse.example.com;

    access_log /var/log/nginx/access.log storyverse;

    # --- TLS (use a real cert - certbot --nginx or your provider) ---
    ssl_certificate     /etc/letsencrypt/live/storyverse.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storyverse.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Uploads: backend cap is 10MB; allow a little slack for multipart overhead ---
    client_max_body_size 12m;

    # --- The React SPA ---
    root /var/www/storyverse;
    index index.html;

    # Hashed asset filenames never change -> cache forever. IMMUTABLE is ignored by
    # old browsers that do not understand it (they revalidate instead - safe).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached - it is the entry point for new deploys.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (React Router) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API proxy ---
    location /api/ {
        limit_req zone=storyverse_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # MUST be set: rate limiting keys on the real client IP. The backend only
        # honors it when TRUSTED_PROXIES contains this proxy's IP (set it!).
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        # The backend already sends Cache-Control on public GETs (30s) - keep it.
        # For WebSocket support (none today) you would add Upgrade headers here.
    }

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/xml text/javascript;

    # If you compile the brotli module, prefer it over gzip:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_static on;   # pre-compressed .br files next to assets

    # --- Security headers ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Scripts/styles are self-hosted (fonts come from Google Fonts); images come from
    # Cloudinary. The app uses inline style attributes (React), hence style-src
    # 'unsafe-inline' - keep it that way.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://res.cloudinary.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}